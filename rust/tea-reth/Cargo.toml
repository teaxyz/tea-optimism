[package]
name = "tea-reth"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true

[[bin]]
name = "tea-reth"
path = "src/main.rs"

[dependencies]
# reth
reth-cli-util.workspace = true
reth-node-builder.workspace = true
reth-op = { workspace = true, features = ["node", "rpc"] }
reth-optimism-cli.workspace = true
reth-optimism-forks.workspace = true
reth-optimism-chainspec.workspace = true

# revm
revm.workspace = true
op-revm.workspace = true

# alloy
alloy-evm.workspace = true
alloy-op-evm.workspace = true
alloy-primitives.workspace = true
op-alloy-network.workspace = true

# tea (shared with kona FPVM — keeps L1-cost constants and exchange-rate
# arithmetic in one place so EL and FPVM cannot drift)
tea-l1-cost.workspace = true

# tea precompiles (GPG/SSH/SSHSIG verify at 0x0696-0x0698). Lives in its own
# std crate so kona-host's fault-proof accelerator runs the exact same crypto
# as the EL — see tea-precompiles/src/lib.rs. The EL needs the full crypto, so
# enable `std` (the workspace dep defaults it off for the no_std FPVM).
tea-precompiles = { workspace = true, features = ["std"] }

# misc
clap = { workspace = true, features = ["derive", "env"] }
eyre.workspace = true
tracing.workspace = true

[dev-dependencies]
alloy-primitives = { workspace = true, features = ["std"] }
hex = "0.4.3"

[features]
default = []
