[package]
name = "kona-client"
version = "1.0.2"
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
# Proof
kona-mpt.workspace = true
kona-preimage.workspace = true
kona-executor.workspace = true
kona-proof.workspace = true
kona-proof-interop.workspace = true
kona-std-fpvm.workspace = true
kona-std-fpvm-proc.workspace = true

# Protocol
kona-derive.workspace = true
kona-driver.workspace = true
kona-interop.workspace = true
kona-registry.workspace = true
kona-protocol.workspace = true
kona-genesis = { workspace = true, features = ["serde"] }

# Alloy
alloy-rlp.workspace = true
alloy-eips.workspace = true
alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-rpc-types-engine.workspace = true

# Op Alloy
op-alloy-consensus.workspace = true
op-alloy-rpc-types-engine = { workspace = true, features = ["serde"] }

# Execution
revm.workspace = true
op-revm.workspace = true
alloy-op-evm.workspace = true
alloy-evm = { workspace = true, features = ["op"] }

# Tea (shared with tea-reth EL — keeps GasPriceOracle slot, exchange-rate
# arithmetic, and backup-rate fallback in one place so FPVM cannot drift)
tea-l1-cost.workspace = true

# Tea precompiles — the FPVM links only the no_std `gas` slice (addresses + gas
# schedule). The crypto is std-gated and runs on the host via the accelerated-
# precompile path; default-features = false keeps the crypto out of the FPVM.
# See TEAO1-174.
tea-precompiles = { workspace = true }

# General
lru.workspace = true
spin.workspace = true
serde.workspace = true
cfg-if.workspace = true
tracing.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
kona-preimage = { workspace = true, features = ["std"] }
sha2.workspace = true
# Cross-executor parity tests: prove that an EVM produced by tea-reth's
# TeaEvmFactory (EL) and one produced by FpvmOpEvmFactory (FPVM) compute
# byte-identical L1 cost from the same input + state. Path dep because
# tea-reth is publish=false within this workspace.
tea-reth = { path = "../../../tea-reth" }
tea-l1-cost.workspace = true
# std crypto, so the accelerated-precompile parity tests can run the Tea
# precompiles natively (mock host) and compare against the FPVM stub result.
tea-precompiles = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["std"] }
revm = { workspace = true, features = ["std"] }
op-revm = { workspace = true, features = ["std"] }
alloy-evm = { workspace = true, features = ["op"] }
alloy-op-evm.workspace = true
# TEAO1-143 PoC: builds an OpBlockExecutorFactory to run a real fee-paying tx
# through both the stock host-side OpEvmFactory and the Tea-aware FpvmOpEvmFactory.
alloy-op-hardforks.workspace = true

[features]
default = [ "client-tracing" ]
client-tracing = [ "kona-std-fpvm/tracing" ]

[[bin]]
name = "kona-client"
path = "src/kona.rs"

[[bin]]
name = "kona-client-int"
path = "src/kona_interop.rs"
